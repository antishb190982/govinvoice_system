{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pages">
  <span>{{ page.start_index }}–{{ page.end_index }} of {{ page.paginator.count }}</span>
  {% if page.has_previous %}<a class="btn btn-sm" href="?{% if page.querystring %}{{ page.querystring }}&amp;{% endif %}page={{ page.previous_page_number }}">Previous</a>{% endif %}
  {% if page.has_next %}<a class="btn btn-sm" href="?{% if page.querystring %}{{ page.querystring }}&amp;{% endif %}page={{ page.next_page_number }}">Next</a>{% endif %}
</nav>
{% endif %}
