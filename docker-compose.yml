# Production-style stack. Terminate TLS in front of `web` (agency load balancer,
# nginx or similar) and point it at port 8000; HSTS and secure cookies are on.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: govbills
      POSTGRES_USER: govbills
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    # PostgreSQL is the system's backend database: invoices, approvals, signatures,
    # audit chain, configuration and integration logs all live here.
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govbills"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py setup_govbills &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --forwarded-allow-ips '*'"
    ports: ["127.0.0.1:8000:8000"]
    volumes: [appdata:/data]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  scheduler:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    command: python manage.py run_scheduler --loop 300
    volumes: [appdata:/data]
    depends_on: [web]

  # Analyses large scan/photo uploads in the background (OCR).
  ocr-worker:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    command: python manage.py ocr_worker --loop 5
    volumes: [appdata:/data]
    depends_on: [web]

  # Shared cache: API rate limits across all web workers.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  pgdata:
  appdata:
